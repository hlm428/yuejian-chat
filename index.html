<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="《月见公寓》四位女主聊天页——宋知夕、幸曦月、顾云笙、皇甫夜澜" />
    <title>月见公寓 · 和她们聊天</title>
    <link rel="stylesheet" href="css/style.css?v=5" />
  </head>
  <body class="theme-default">
    <!-- 选人界面 -->
    <section id="picker" class="page">
      <header class="topbar">
        <h1>月见公寓</h1>
        <button id="settingsBtn" class="iconBtn" title="设置">⚙️</button>
      </header>
      <p class="pickTip">点谁，就跟谁聊。她们住在同一栋楼里，但心里装的都是你。</p>
      <div id="charGrid" class="charGrid"></div>
      <footer class="foot">聊天走 EXAONE 免费接口 · Key 与记录只存在你的浏览器</footer>
    </section>

    <!-- 聊天界面 -->
    <section id="chat" class="page" style="display: none">
      <header class="chatTop">
        <button id="backBtn" class="iconBtn" title="返回选人">←</button>
        <img id="chatAvatar" class="chatAvatar" alt="头像" />
        <div class="chatTitle">
          <div id="chatName">—</div>
          <div id="chatRoom">—</div>
        </div>
        <div class="affWrap">
          <div id="affText" class="affText">好感度 0</div>
          <div class="affTrack"><div id="affBar" class="affBar"></div></div>
        </div>
        <button id="clearBtn" class="iconBtn" title="清空当前女主的聊天记录和好感度">🧹</button>
        <button id="settingsBtn2" class="iconBtn" title="设置" onclick="openSettings()">⚙️</button>
      </header>

      <main id="messages" class="messages"></main>
      <div id="openers" class="openers"></div>

      <footer class="inputBar">
        <textarea id="input" rows="1" placeholder="说点什么……（Enter 发送）"></textarea>
        <button id="sendBtn" class="sendBtn">发送</button>
      </footer>
    </section>

    <!-- 设置弹层 -->
    <div id="settings" class="settingsMask">
      <div class="settingsCard">
        <h2>⚙️ 设置</h2>
        <p id="settingsNotice" class="settingsNotice"></p>
        <label class="settingsLabel">
          <span>EXAONE API Key（只存本地，不上传）</span>
          <input id="keyInput" type="password" placeholder="sk-…" />
        </label>
        <label class="settingsLabel">
          <span>接口地址（EXAONE 禁止网页直连时，改成你的本地代理）</span>
          <input id="baseInput" type="text" placeholder="https://api.exaone.ai/v1" />
        </label>
        <p class="settingsHint">模型：k-exaone-2.5-32b（OpenAI 兼容 /chat/completions）</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="testConn" class="btn" style="border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:8px 14px; cursor:pointer; font-size:12.5px; background:transparent">🔌 测试连接</button>
          <span id="testResult" style="font-size:12px; align-self:center; color:var(--sub)"></span>
        </div>
        <button id="copyProxy" class="ghostBtn copyProxy">📋 复制局域网代理命令（手机线路·推荐）</button>
        <a class="ghostBtn copyProxy" style="text-decoration:none; text-align:center" href="https://github.com/hlm428/exaone-proxy#readme" target="_blank" rel="noreferrer">☁️ 云端 Worker（需手机网络能访问 workers.dev）</a>
        <a class="ghostBtn copyProxy" style="text-decoration:none; text-align:center" href="https://github.com/hlm428/exaone-proxy#部署二选一推荐-a" target="_blank" rel="noreferrer">☁️ 推荐：部署云端代理（Cloudflare Workers 免费档，点看一步命令）</a>
        <div class="settingsBtns">
          <button id="keyClose" class="ghostBtn">取消</button>
          <button id="keySave" class="primaryBtn">保存</button>
        </div>
      </div>
    </div>

    <script src="js/characters.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
  </body>
</html>
